<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zxjy_云存储</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html { font-size: 16px; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 10px; }
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 8px; line-height: 1.3; }
        .subtitle { color: #7f8c8d; font-size: 0.95rem; max-width: 800px; margin: 0 auto; line-height: 1.5; }
        .storage-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .storage-bar { height: 8px; background-color: rgba(255,255,255,0.3); border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .storage-used { height: 100%; width: 65%; background: linear-gradient(90deg, #2ecc71, #1abc9c); border-radius: 4px; transition: width 0.5s ease; }

        .search-section {
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .search-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-header h2 { color: #2c3e50; font-size: 1.4rem; }
        .search-header .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
        .refresh-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.3s ease;
        }
        .refresh-btn:hover { background-color: #27ae60; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .refresh-btn .fa-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .search-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .search-box { width: 100%; position: relative; }
        .search-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }
        .search-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
            background-color: white;
        }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #7f8c8d; }
        .search-filters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }
        .filter-select {
            padding: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #f9f9f9;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c3e50' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
            padding-right: 35px;
        }
        .filter-select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
            background-color: white;
        }
        .search-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        .search-btn:hover { background-color: #2980b9; }
        .search-btn i { margin-right: 8px; }
        .search-results-info {
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .search-results-info.hidden { display: none; }
        .clear-search-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        .clear-search-btn:hover { background-color: #c0392b; }

        .file-container {
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .file-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }
        .file-header h2 { color: #2c3e50; font-size: 1.4rem; }
        .file-count {
            background-color: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            align-self: flex-start;
        }
        .file-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .file-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 4px solid #3498db;
            display: flex;
            align-items: flex-start;
            position: relative;
        }
        .file-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
        }
        .file-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .pdf { background-color: #ffebe6; color: #e74c3c; border-left-color: #e74c3c; }
        .image { background-color: #e6f7ff; color: #3498db; border-left-color: #3498db; }
        .doc { background-color: #e6ffe6; color: #27ae60; border-left-color: #27ae60; }
        .zip { background-color: #f5e6ff; color: #9b59b6; border-left-color: #9b59b6; }
        .video { background-color: #fff0e6; color: #e67e22; border-left-color: #e67e22; }
        .audio { background-color: #e6f9ff; color: #1abc9c; border-left-color: #1abc9c; }
        .code { background-color: #fff5e6; color: #f39c12; border-left-color: #f39c12; }
        .txt { background-color: #f2f2f2; color: #7f8c8d; border-left-color: #7f8c8d; }
        .exe { background-color: #0078d7; color: white; border-left-color: #0078d7; }
        .apk { background-color: #3ddc84; color: white; border-left-color: #3ddc84; }

        .file-info { flex-grow: 1; min-width: 0; }
        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: #2c3e50;
            word-break: break-word;
            font-size: 0.95rem;
            line-height: 1.3;
        }
        .file-details {
            font-size: 0.8rem;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
        }
        .download-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: background-color 0.3s ease;
            min-width: auto;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .download-btn:hover:not(:disabled) { background-color: #2980b9; }
        .download-btn:disabled { background-color: #95a5a6; cursor: not-allowed; opacity: 0.7; }
        .download-btn i { margin-right: 5px; font-size: 0.9rem; }

        .file-check-status {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 5px;
            display: inline-block;
        }
        .status-available { background-color: #d4edda; color: #155724; }
        .status-unavailable { background-color: #f8d7da; color: #721c24; }
        .security-warning {
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 8px;
            margin-left: 5px;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: inline-block;
        }

        .upload-section {
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .upload-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            margin-top: 12px;
            width: 100%;
        }
        .upload-btn:hover { background-color: #27ae60; }
        .upload-btn i { margin-right: 8px; }

        .checking-files {
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        .checking-files.hidden { display: none; }
        .file-check-progress { height: 5px; background-color: #ecf0f1; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .file-check-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3498db, #2ecc71); border-radius: 3px; transition: width 0.3s ease; }

        .no-results {
            text-align: center;
            padding: 30px 15px;
            color: #7f8c8d;
            font-size: 1rem;
            grid-column: 1 / -1;
        }
        .no-results i { font-size: 2.5rem; margin-bottom: 15px; color: #bdc3c7; }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }
        .error-message.active { display: block; }

        .data-source-info {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 6px;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #7f8c8d;
            font-size: 0.8rem;
            margin-top: 20px;
        }
        .github-link { color: #3498db; text-decoration: none; font-weight: 600; }

        /* responsive */
        @media (min-width: 600px) {
            html { font-size: 17px; }
            body { padding: 15px; }
            .container { padding: 15px; }
            header { padding: 20px; }
            h1 { font-size: 2.2rem; }
            .storage-info { flex-direction: row; justify-content: space-between; align-items: center; }
            .search-container { flex-direction: row; }
            .search-filters { grid-template-columns: repeat(4, 1fr); }
            .search-results-info { flex-direction: row; justify-content: space-between; align-items: center; }
            .clear-search-btn { width: auto; }
            .file-header { flex-direction: row; justify-content: space-between; align-items: center; }
            .file-list { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .upload-btn { width: auto; }
            .search-header { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        @media (min-width: 900px) {
            html { font-size: 18px; }
            body { padding: 20px; }
            .container { padding: 20px; }
            .file-list { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1200px) {
            .file-list { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 350px) {
            html { font-size: 15px; }
            .file-card { flex-direction: column; align-items: flex-start; }
            .download-btn { margin-left: 0; margin-top: 10px; width: 100%; }
            .file-icon { margin-bottom: 10px; }
            .search-filters { grid-template-columns: 1fr; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .search-filters { grid-template-columns: repeat(2, 1fr); }
            .file-list { grid-template-columns: repeat(2, 1fr); }
        }
        @media (hover: none) and (pointer: coarse) {
            .file-card:hover { transform: none; }
            .download-btn, .search-btn, .upload-btn, .filter-select { min-height: 44px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud"></i> Zxjy_云存储</h1>
            <p class="subtitle">安全、便捷的云存储空间。支持多种文件格式的预览和下载。</p>
            <div class="storage-info">
                <div>
                    <span>已使用: <strong id="usedSpace">-1 GB</strong> / <span id="totalSpace">10 GB</span></span>
                    <div class="storage-bar"><div class="storage-used" id="storageBar" style="width:65%"></div></div>
                </div>
                <div>
                    <span>剩余空间: <strong id="remainingSpace">-1 GB</strong></span>
                </div>
            </div>
        </header>

        <main>
            <div class="search-section">
                <div class="search-header">
                    <h2><i class="fas fa-search"></i> 搜索文件</h2>
                    <div class="toolbar">
                        <button class="refresh-btn" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> 刷新列表
                        </button>
                    </div>
                </div>

                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchInput" placeholder="输入文件名关键词进行搜索...">
                    </div>
                    <button class="search-btn" id="searchBtn">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>

                <div class="search-filters">
                    <select class="filter-select" id="typeFilter">
                        <option value="">所有文件类型</option>
                        <option value="pdf">PDF文档</option>
                        <option value="image">图片文件</option>
                        <option value="doc">文档文件</option>
                        <option value="zip">压缩文件</option>
                        <option value="video">视频文件</option>
                        <option value="audio">音频文件</option>
                        <option value="code">代码文件</option>
                        <option value="txt">文本文件</option>
                        <option value="exe">Windows程序</option>
                        <option value="apk">Android应用</option>
                    </select>
                    <select class="filter-select" id="sizeFilter">
                        <option value="">所有文件大小</option>
                        <option value="small">小于 1 MB</option>
                        <option value="medium">1 MB - 10 MB</option>
                        <option value="large">大于 10 MB</option>
                    </select>
                    <select class="filter-select" id="dateFilter">
                        <option value="">所有时间</option>
                        <option value="today">今天</option>
                        <option value="week">最近一周</option>
                        <option value="month">最近一月</option>
                        <option value="year">最近一年</option>
                    </select>
                    <select class="filter-select" id="availabilityFilter">
                        <option value="">所有状态</option>
                        <option value="available">仅显示可用文件</option>
                        <option value="unavailable">仅显示不可用文件</option>
                    </select>
                </div>

                <div class="search-results-info hidden" id="searchResultsInfo">
                    <div>
                        <span id="searchResultsCount">0</span> 个文件匹配搜索条件
                    </div>
                    <button class="clear-search-btn" id="clearSearchBtn">
                        <i class="fas fa-times"></i> 清除搜索
                    </button>
                </div>
            </div>

            <div class="checking-files hidden" id="checkingFiles">
                <p><i class="fas fa-spinner fa-spin"></i> <span id="checkingStatus">正在检查文件可用性...</span></p>
                <div class="file-check-progress">
                    <div class="file-check-bar" id="fileCheckBar"></div>
                </div>
            </div>

            <div class="error-message" id="errorMessage">
                <strong><i class="fas fa-exclamation-triangle"></i> 错误:</strong> <span id="errorText"></span>
            </div>

            <div class="file-container">
                <div class="file-header">
                    <h2><i class="fas fa-folder-open"></i> 我的文件</h2>
                    <div class="file-count" id="fileCount">0 个文件</div>
                </div>
                <div class="file-list" id="fileList"></div>
                <div class="data-source-info" id="dataSourceInfo">数据源: 加载中...</div>
            </div>
        </main>

        <footer>
            <p>此云存储库部署于 <a href="https://github.com" class="github-link" target="_blank">GitHub Pages</a> | 最后更新: 2025年12月</p>
            <p style="margin-top: 10px;">© 2025 Zxjy云存储库</p>
        </footer>
    </div>

    <script>
        const DEFAULT_FILES = [
            { id: 1, name: "DyVec Release0.5.exe", type: "exe", size: "20160 KB", date: "2025-12-31", icon: "windows",
                iconStyle: "fab", path: "./DyVec Release0.5.exe" },
            { id: 2, name: "帧率优化.exe", type: "exe", size: "1164 KB", date: "2025-12-30", icon: "windows",
                iconStyle: "fab", path: "./帧率优化.exe" },
            { id: 3, name: "StudentSuper.exe", type: "exe", size: "7500 KB", date: "2025-12-30", icon: "windows",
                iconStyle: "fab", path: "./StudentSuper.exe" },
            { id: 4, name: "MT管理器.apk", type: "apk", size: "22.41 MB", date: "2025-12-31", icon: "android",
                iconStyle: "fab", path: "./MT管理器.apk" },
            { id: 5, name: "Polaris2.5.exe", type: "exe", size: "13.3 MB", date: "2026-07-14", icon: "windows",
                iconStyle: "fab", path: "./Polaris2.5.exe" }
        ];

        let fileList = [];
        let fileAvailability = {};
        let currentDisplayedFiles = [];
        let isSearching = false;
        let currentSearchQuery = "";
        let currentTypeFilter = "";
        let currentSizeFilter = "";
        let currentDateFilter = "";
        let currentAvailabilityFilter = "";
        let dataSource = '默认数据';

        const fileListEl = document.getElementById('fileList');
        const fileCountEl = document.getElementById('fileCount');
        const checkingFilesEl = document.getElementById('checkingFiles');
        const fileCheckBar = document.getElementById('fileCheckBar');
        const checkingStatus = document.getElementById('checkingStatus');
        const errorMessageEl = document.getElementById('errorMessage');
        const errorTextEl = document.getElementById('errorText');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const typeFilter = document.getElementById('typeFilter');
        const sizeFilter = document.getElementById('sizeFilter');
        const dateFilter = document.getElementById('dateFilter');
        const availabilityFilter = document.getElementById('availabilityFilter');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchResultsInfo = document.getElementById('searchResultsInfo');
        const searchResultsCount = document.getElementById('searchResultsCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const dataSourceInfo = document.getElementById('dataSourceInfo');

        function showError(message) {
            errorTextEl.textContent = message;
            errorMessageEl.classList.add('active');
            setTimeout(() => errorMessageEl.classList.remove('active'), 6000);
        }

        function formatFileSize(sizeStr) {
            const parts = sizeStr.trim().split(' ');
            if (parts.length !== 2) return 0;
            const val = parseFloat(parts[0]);
            const unit = parts[1].toUpperCase();
            if (unit === 'KB') return val / 1024;
            if (unit === 'MB') return val;
            if (unit === 'GB') return val * 1024;
            return val;
        }

        function parseDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? new Date() : d;
        }

        async function loadFilesFromJSON() {
            try {
                const response = await fetch('/files.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('JSON 数据格式无效或为空');
                }
                const loaded = data.map((f, index) => ({
                    id: f.id || index + 1,
                    name: f.name || '未命名文件',
                    type: f.type || 'txt',
                    size: f.size || '0 KB',
                    date: f.date || new Date().toISOString().slice(0, 10),
                    icon: f.icon || 'file',
                    iconStyle: f.iconStyle || 'fas',
                    path: f.path || './' + (f.name || 'file'),
                    description: f.description || ''
                }));
                dataSource = 'files.json (外部数据)';
                return loaded;
            } catch (err) {
                console.warn('加载 files.json 失败，使用默认数据:', err.message);
                dataSource = '默认后备数据 (files.json 未加载)';
                return DEFAULT_FILES.map((f, index) => ({ ...f, id: f.id || index + 1 }));
            }
        }

        async function checkFileExists(filePath) {
            try {
                const resp = await fetch(filePath, { method: 'HEAD', cache: 'no-cache' });
                return resp.ok;
            } catch {
                return false;
            }
        }

        async function checkAllFilesAvailability(files, onProgress) {
            const total = files.length;
            fileAvailability = {};
            for (let i = 0; i < total; i++) {
                const file = files[i];
                const exists = await checkFileExists(file.path);
                fileAvailability[file.id] = exists;
                if (onProgress) {
                    onProgress(i + 1, total, file.name, exists);
                }
                await new Promise(r => setTimeout(r, 80));
            }
            return fileAvailability;
        }

        function renderFileList(files) {
            fileListEl.innerHTML = '';
            if (!files || files.length === 0) {
                fileListEl.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-folder-open"></i>
                        <p>暂无文件</p>
                        <p style="font-size:0.9rem;margin-top:8px;">请上传文件或检查数据源</p>
                    </div>
                `;
                fileCountEl.textContent = '0 个文件';
                return;
            }

            files.forEach(file => {
                const isAvailable = fileAvailability[file.id] || false;
                const statusClass = isAvailable ? 'status-available' : 'status-unavailable';
                const statusText = isAvailable ? '可用' : '不可用';
                const securityWarning = (file.type === 'exe' || file.type === 'apk') ?
                    '<span class="security-warning">安全警告</span>' : '';
                const iconClass = file.iconStyle || 'fas';

                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-icon ${file.type}">
                        <i class="${iconClass} fa-${file.icon}"></i>
                    </div>
                    <div class="file-info">
                        <div class="file-name">
                            ${file.name}
                            <span class="file-check-status ${statusClass}">${statusText}</span>
                            ${securityWarning}
                        </div>
                        <div class="file-details">
                            <span>${file.size}</span>
                            <span>${file.date}</span>
                        </div>
                        ${file.description ? `<div style="font-size:0.75rem;color:#3498db;margin-top:4px;">${file.description}</div>` : ''}
                    </div>
                    <button class="download-btn" 
                            data-file-id="${file.id}"
                            data-file-name="${file.name}"
                            data-file-size="${file.size}"
                            data-file-path="${file.path}"
                            data-file-type="${file.type}"
                            ${!isAvailable ? 'disabled' : ''}>
                        <i class="fas fa-download"></i> 下载
                    </button>
                `;
                fileListEl.appendChild(card);
            });

            const totalCount = isSearching ? files.length : fileList.length;
            const searchLabel = isSearching ? ` (${files.length} 个匹配)` : '';
            fileCountEl.textContent = `${totalCount} 个文件${searchLabel}`;

            updateSearchResultsInfo(files.length);
            bindDownloadButtonEvents();
            updateDataSourceInfo();
        }

        function updateDataSourceInfo() {
            const total = fileList.length;
            const available = Object.values(fileAvailability).filter(v => v).length;
            dataSourceInfo.textContent = `数据源: ${dataSource} · 共 ${total} 个文件 · ${available} 个可用`;
        }

        function updateSearchResultsInfo(count) {
            if (isSearching && (currentSearchQuery || currentTypeFilter || currentSizeFilter || currentDateFilter ||
                    currentAvailabilityFilter)) {
                searchResultsCount.textContent = count;
                searchResultsInfo.classList.remove('hidden');
            } else {
                searchResultsInfo.classList.add('hidden');
            }
        }

        // ========== 修改：下载按钮跳转到 download.html ==========
        function bindDownloadButtonEvents() {
            document.querySelectorAll('.download-btn[data-file-id]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;

                    const fileName = this.dataset.fileName;
                    // 对文件名进行编码，确保特殊字符（包括空格、?、&等）被正确处理
                    const encoded = encodeURIComponent(fileName);
                    // 跳转到下载页
                    window.open('/download.html?file=' + encoded, '_blank');
                });
            });
        }

        function performSearch() {
            currentSearchQuery = searchInput.value.toLowerCase().trim();
            currentTypeFilter = typeFilter.value;
            currentSizeFilter = sizeFilter.value;
            currentDateFilter = dateFilter.value;
            currentAvailabilityFilter = availabilityFilter.value;

            const filtered = fileList.filter(file => {
                let match = true;
                if (currentSearchQuery) {
                    match = match && file.name.toLowerCase().includes(currentSearchQuery);
                }
                if (currentTypeFilter) {
                    match = match && file.type === currentTypeFilter;
                }
                if (currentSizeFilter) {
                    const sizeMB = formatFileSize(file.size);
                    if (currentSizeFilter === 'small') match = match && sizeMB < 1;
                    else if (currentSizeFilter === 'medium') match = match && sizeMB >= 1 && sizeMB <= 10;
                    else if (currentSizeFilter === 'large') match = match && sizeMB > 10;
                }
                if (currentDateFilter) {
                    const fileDate = parseDate(file.date);
                    const now = new Date();
                    const diff = (now - fileDate) / (1000 * 3600 * 24);
                    if (currentDateFilter === 'today') match = match && diff < 1;
                    else if (currentDateFilter === 'week') match = match && diff < 7;
                    else if (currentDateFilter === 'month') match = match && diff < 30;
                    else if (currentDateFilter === 'year') match = match && diff < 365;
                }
                if (currentAvailabilityFilter) {
                    const avail = fileAvailability[file.id] || false;
                    if (currentAvailabilityFilter === 'available') match = match && avail;
                    else if (currentAvailabilityFilter === 'unavailable') match = match && !avail;
                }
                return match;
            });

            currentDisplayedFiles = filtered;
            isSearching = true;
            renderFileList(filtered);
        }

        function clearSearch() {
            searchInput.value = '';
            typeFilter.value = '';
            sizeFilter.value = '';
            dateFilter.value = '';
            availabilityFilter.value = '';
            currentSearchQuery = "";
            currentTypeFilter = "";
            currentSizeFilter = "";
            currentDateFilter = "";
            currentAvailabilityFilter = "";
            isSearching = false;
            currentDisplayedFiles = [...fileList];
            renderFileList(fileList);
        }

        async function refreshData() {
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 加载中...';

            checkingFilesEl.classList.remove('hidden');
            checkingStatus.textContent = '正在加载文件列表...';
            fileCheckBar.style.width = '0%';

            try {
                const loaded = await loadFilesFromJSON();
                fileList = loaded;
                currentDisplayedFiles = [...fileList];
                isSearching = false;

                searchInput.value = '';
                typeFilter.value = '';
                sizeFilter.value = '';
                dateFilter.value = '';
                availabilityFilter.value = '';
                currentSearchQuery = "";
                currentTypeFilter = "";
                currentSizeFilter = "";
                currentDateFilter = "";
                currentAvailabilityFilter = "";

                checkingStatus.textContent = '正在检测文件可用性...';
                await checkAllFilesAvailability(fileList, (done, total, name, exists) => {
                    const pct = Math.round((done / total) * 100);
                    fileCheckBar.style.width = `${pct}%`;
                    checkingStatus.textContent = `检测中 ${done}/${total}: ${name} ${exists ? '✅' : '❌'}`;
                });

                checkingFilesEl.classList.add('hidden');
                renderFileList(fileList);
                updateDataSourceInfo();

                const available = Object.values(fileAvailability).filter(v => v).length;
                showSuccess(`已加载 ${fileList.length} 个文件，${available} 个可用`);

            } catch (err) {
                checkingFilesEl.classList.add('hidden');
                showError(`刷新失败: ${err.message}`);
                console.error(err);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新列表';
            }
        }

        function showSuccess(msg) {
            const el = document.getElementById('errorMessage');
            el.className = 'error-message';
            el.style.display = 'block';
            el.style.background = '#d4edda';
            el.style.color = '#155724';
            el.style.borderColor = '#c3e6cb';
            errorTextEl.textContent = msg;
            setTimeout(() => {
                el.style.display = 'none';
                el.style.background = '';
                el.style.color = '';
                el.style.borderColor = '';
            }, 3500);
        }

        function updateStorage() {
            const total = 10;
            const used = fileList.reduce((sum, f) => {
                const mb = formatFileSize(f.size);
                return sum + (isNaN(mb) ? 0 : mb);
            }, 0);
            const usedGB = Math.min(used / 1024, total);
            const pct = Math.min((usedGB / total) * 100, 100);

            document.getElementById('usedSpace').textContent = usedGB.toFixed(2) + ' GB';
            document.getElementById('remainingSpace').textContent = (total - usedGB).toFixed(2) + ' GB';
            document.getElementById('storageBar').style.width = pct + '%';
        }

        async function init() {
            checkingFilesEl.classList.remove('hidden');
            checkingStatus.textContent = '正在加载文件列表...';
            fileCheckBar.style.width = '0%';

            const loaded = await loadFilesFromJSON();
            fileList = loaded;
            currentDisplayedFiles = [...fileList];

            checkingStatus.textContent = '正在检测文件可用性...';
            await checkAllFilesAvailability(fileList, (done, total, name, exists) => {
                const pct = Math.round((done / total) * 100);
                fileCheckBar.style.width = `${pct}%`;
                checkingStatus.textContent = `检测中 ${done}/${total}: ${name} ${exists ? '✅' : '❌'}`;
            });

            checkingFilesEl.classList.add('hidden');
            renderFileList(fileList);
            updateStorage();
            updateDataSourceInfo();

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            typeFilter.addEventListener('change', performSearch);
            sizeFilter.addEventListener('change', performSearch);
            dateFilter.addEventListener('change', performSearch);
            availabilityFilter.addEventListener('change', performSearch);
            clearSearchBtn.addEventListener('click', clearSearch);

            searchInput.addEventListener('input', debounce(function() {
                if (!this.value.trim()) {
                    clearSearch();
                } else {
                    performSearch();
                }
            }, 350));

            refreshBtn.addEventListener('click', refreshData);

            setInterval(updateStorage, 10000);

            console.log(`✅ Zxjy_云存储 初始化完成 · 数据源: ${dataSource} · ${fileList.length} 个文件`);
        }

        function debounce(fn, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
