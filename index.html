    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: rgba(0, 0, 0, 0.25);
            --gold: #ffd700;
            --orange: #ff8c00;
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #0b1a3a, #1a2a6c, #6b1a2a, #b21f1f, #fdbb2d);
            background-size: 500% 500%;
            animation: gradientFlow 18s ease-in-out infinite alternate;
            overflow-x: hidden;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        body::before {
            width: 50vw;
            height: 50vw;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, #ffd700, transparent 70%);
            animation-delay: 0s;
        }
        body::after {
            width: 40vw;
            height: 40vw;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.1);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            padding: 48px 44px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 30px 80px var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            transition: box-shadow 0.5s;
        }

        .container:hover {
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .header {
            position: relative;
            margin-bottom: 36px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }

        .avatar-wrapper img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.5s, box-shadow 0.5s;
            animation: avatarFloat 5s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        .avatar-wrapper img:hover {
            transform: scale(1.04) rotate(-2deg);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.25);
        }

        @keyframes avatarFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.2);
            animation: ringPulse 3s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .avatar-ring:nth-child(2) {
            inset: -18px;
            border-color: rgba(255, 140, 0, 0.1);
            animation-delay: 0.6s;
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.1;
            }
        }

        .name {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 10%, var(--gold) 50%, var(--orange) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 4px 20px rgba(255, 215, 0, 0.15));
            animation: textGlow 3s ease-in-out infinite alternate;
            line-height: 1.1;
        }

        @keyframes textGlow {
            0% {
                filter: drop-shadow(0 4px 20px rgba(255, 215, 0, 0.10));
            }
            100% {
                filter: drop-shadow(0 4px 40px rgba(255, 215, 0, 0.30));
            }
        }

        .subtitle-wrap {
            margin-top: 8px;
            min-height: 2.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .subtitle {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.92;
            color: rgba(255, 255, 255, 0.85);
            display: inline-block;
            border-right: 2px solid var(--gold);
            padding-right: 6px;
            animation: blinkCursor 0.8s step-end infinite;
            white-space: nowrap;
        }

        @keyframes blinkCursor {
            0%,
            100% {
                border-color: var(--gold);
            }
            50% {
                border-color: transparent;
            }
        }

        .status-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            border-radius: 30px;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.20);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        .status-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 8px;
            animation: dotPulse 2s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 28px 22px 24px;
            text-align: left;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s,
                background 0.4s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.03), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            border-radius: 16px;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.09);
        }

        .card:hover::after {
            opacity: 1;
        }

        .card .icon {

            margin-bottom: 12px;
            display: block;
        }

        .card h3 {

            z-index: 1;
        }

        .card .tag {

            letter-spacing: 0.3px;

        .card:hover .tag {

            color: rgba(255, 255, 255, 0.85);
        }

        .social-links {
            display: flex;

        .social-icon {

        .social-icon .label {

            pointer-events: none;
            white-space: nowrap;
        }
        .toast-container.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .toast-container .toast-icon {
            font-size: 1.3rem;
            line-height: 1;

            }
            .toast-container {

                border-radius: 20px;
                gap: 8px;
            }
            .toast-container .toast-icon {
                font-size: 1.1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.25);

        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.40);
        }

        .container {
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card {
            opacity: 0;
            animation: cardIn 0.7s ease forwards;
        }
        .card:nth-child(1) {
            animation-delay: 0.10s;
        }
        .card:nth-child(2) {
            animation-delay: 0.20s;
        }
        .card:nth-child(3) {
            animation-delay: 0.30s;
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-icon {
            opacity: 0;
            animation: iconIn 0.5s ease forwards;
        }
        .social-icon:nth-child(1) {
            animation-delay: 0.35s;
        }
        .social-icon:nth-child(2) {
            animation-delay: 0.42s;
        }
        .social-icon:nth-child(3) {
            animation-delay: 0.49s;
        }
        .social-icon:nth-child(4) {
            animation-delay: 0.56s;
        }

        @keyframes iconIn {
            0% {
                opacity: 0;
                transform: scale(0.6) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }
    </style>
</head>

<script>
    (function() {
        'use strict';

        const phrases = [
            '探索 · 创造 · 分享',
            '代码 · 设计 · 生活',
            '保持好奇 · 持续生长',
            '用热爱驱动每一天'
        ];

        const el = document.getElementById('typingText');
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let timer = null;

        function typeEffect() {
            const current = phrases[phraseIndex];
            if (!isDeleting) {
                el.textContent = current.slice(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) {
                    isDeleting = true;
                    clearTimeout(timer);
                    timer = setTimeout(typeEffect, 2200);
                    return;
                }
                timer = setTimeout(typeEffect, 80 + Math.random() * 40);
            } else {
                el.textContent = current.slice(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    timer = setTimeout(typeEffect, 400);
                    return;
                }
                timer = setTimeout(typeEffect, 40 + Math.random() * 30);
            }
        }
        typeEffect();

        const container = document.querySelector('.container');
        let mouseX = 0,
            mouseY = 0;
        let currentX = 0,
            currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / rect.width - 0.5;
            mouseY = (e.clientY - rect.top) / rect.height - 0.5;
        });

        function animateGlow() {
            currentX += (mouseX - currentX) * 0.06;
            currentY += (mouseY - currentY) * 0.06;

            const rotateX = currentY * 3;
            const rotateY = currentX * 3;
            container.style.transform =
                `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1)`;

            const glowX = 50 + currentX * 30;
            const glowY = 50 + currentY * 30;
            container.style.setProperty('--glow-pos', `${glowX}% ${glowY}%`);

            requestAnimationFrame(animateGlow);
        }

        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            animateGlow();
        }

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.setProperty('--rx', `${x * 4}deg`);
                card.style.setProperty('--ry', `${-y * 4}deg`);
                card.style.transform =
                    `translateY(-8px) scale(1.01) perspective(800px) rotateX(${y * 4}deg) rotateY(${-x * 4}deg)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = '';
            });
        });

        const qzoneLink = document.getElementById('qzone-link');
        let toastTimer = null;

        function showToast(message, icon = '🐧') {
            const existing = document.querySelector('.toast-container');
            if (existing) existing.remove();
            if (toastTimer) clearTimeout(toastTimer);

            const toast = document.createElement('div');
            toast.className = 'toast-container';
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-message">${message}</span>
            `;
            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 350);
            }, 2800);
        }

        qzoneLink.addEventListener('click', function(e) {
            e.preventDefault();
            showToast('QQ空间暂不可用，请稍后再试', '🐧');
        });

    })();
</script>
</body>
</html>
