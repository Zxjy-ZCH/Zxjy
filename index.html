<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zxjy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .name-container {
            margin-bottom: 40px;
            position: relative;
        }

        .name {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 140, 0, 0.6); }
        }

        .subtitle {
            font-size: 1.5rem;
            margin-top: 10px;
            font-weight: 300;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ffd700;
        }

        .card p {
            line-height: 1.6;
            font-weight: 300;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .social-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 3.5rem;
            }

            .container {
                padding: 30px 20px;
            }

            .card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="name-container">
            <h1 class="name">Zxjy</h1>
            <img width="200" height="200" src="https://api.yuafeng.cn/API/qqtx/api.php?qq=1104590487">
            <p class="subtitle">探索 · 创造 · 分享</p>
        </div>
      <div class="content">
            <div class="card">
                <h3>介绍</h3>
                <p>这就是一个普通的自我介绍网页？</p>
            </div>

            <div class="card">
                <h3>兴趣领域</h3>
                <p>网页设计、用户体验、前端开发、数字艺术、音乐创作、摄影和旅行。不断探索新的技术和创意表达方式。</p>
            </div>

            <div class="card">
                <h3>联系我</h3>
                <p>如果您对我的作品感兴趣，欢迎通过下面的按钮下载。期待与您交流创意和想法。</p>
            </div>
        </div>
        </div>
        <div class="social-links">
            <a href="https://www.douyin.com/user/MS4wLjABAAAATaM_T_9qBIPcDf4my5Ehsbr8HHCiBa9atbXW8PS27KEkPzr40lT-zVYqAhvClFVB?from_tab_name=main" class="social-icon">🎵</a>
            <a href="https://1104590487.qzone.qq.com" class="social-icon">🐧</a>
            <a href="Cloud Storage.html" class="social-icon">⬇️</a>
            <a href="404.html" class="social-icon">🎨</a>
        </div>

        <div class="footer">
            <p>&copy; 2025 Zxjy. 保留所有权利.</p>
        </div>
    </div>
</body>
</html>
